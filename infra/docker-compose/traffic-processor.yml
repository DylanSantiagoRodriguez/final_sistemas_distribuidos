version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    network_mode: "host"
    environment:
      POSTGRES_DB: ${PGDATABASE:-trafico_db}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ../../services/traffic-processor/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  processor:
    build: ../../services/traffic-processor
    container_name: traffic_processor
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - postgres
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-127.0.0.1:9092}
      PGHOST: ${PGHOST:-localhost}
      PGDATABASE: ${PGDATABASE:-trafico_db}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-changeme}
