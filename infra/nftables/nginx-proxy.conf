#!/usr/sbin/nft -f

flush ruleset

table inet filter {
  # Dynamic set: IPs exceeding WS connection limit — logged for forensic analysis
  set ws_abusers {
    type ipv4_addr
    flags dynamic, timeout
    timeout 1h
  }

  chain input {
    type filter hook input priority 0; policy drop;

    iif "lo" accept
    ct state established,related accept
    ip protocol icmp accept

    # SSH — restrict to admin IP
    tcp dport 22 ip saddr { TU_IP_ADMIN/32 } accept

    # HTTP redirect
    tcp dport 80 accept

    # HTTPS/WSS — rate limit: max 10 simultaneous connections per IP
    tcp dport 443 ct state new \
      add @ws_abusers { ip saddr ct count over 10 } \
      log prefix "WS-FLOOD-BLOCKED: " drop

    tcp dport 443 accept

    log prefix "INPUT-DENIED: " drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
