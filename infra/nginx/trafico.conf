upstream traffic_backend {
    ip_hash;
    server 172.31.44.56:3000 max_fails=2 fail_timeout=10s;
    server 172.31.35.34:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name powmlk.abrdns.com;
    return 301 https://powmlk.abrdns.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name powmlk.abrdns.com;

    ssl_certificate     /etc/ssl/certs/trafico.crt;
    ssl_certificate_key /etc/ssl/private/trafico.key;
    ssl_protocols       TLSv1.3;
    ssl_conf_command    Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # WebSocket — long-lived connections for dashboard
    location /ws {
        proxy_pass http://traffic_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        keepalive_timeout   3600s;
    }

    location /api {
        proxy_pass http://traffic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /auth {
        proxy_pass http://traffic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Serve the dashboard panel as static file
    location = / {
        root /var/www/panel;
        index index.html;
    }

    location = /index.html {
        root /var/www/panel;
        index index.html;
    }

    location ~ /\.env  { deny all; }
    location ~ /keys/  { deny all; }
}
